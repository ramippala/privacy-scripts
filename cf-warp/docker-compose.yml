# cf-warp standalone example.
# Start:  docker compose -f cf-warp/docker-compose.yml up -d
#
# Uses its own bridge network and a host-local published port, so it works on
# any machine without assuming an existing subnet or container IP.
# To put it next to another stack instead, delete the `ports:` block, add that
# stack's network under `networks:` with `external: true`, and reach it there by
# service name: socks5://warp:1080
name: cf-warp

services:
  warp:
    image: ghcr.io/ramippala/cf-warp:latest
    container_name: warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - MKNOD
    devices:
      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - 'c 10:200 rwm'
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1   # required for NAT gateway mode (WARP_ENABLE_NAT)
      - net.ipv6.conf.all.disable_ipv6=0
    ports:
      - "127.0.0.1:1080:1080"   # host-local only; drop when joining another network
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp
    environment:
      TZ: Asia/Kolkata
      # Uncomment to let other containers use this as an L3 gateway (masquerade
      # forwarded traffic into the tunnel). Requires net.ipv4.ip_forward=1,
      # already set under sysctls below.
      # WARP_ENABLE_NAT: "1"
      # SOCKS_USER: warp
      # SOCKS_PASS: change-me
      # WARP_LICENSE_KEY: ""      # only for WARP+
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
