name: cf-warp image

on:
  push:
    branches: [cf-warp]
    paths:
      - "cf-warp/**"
      - ".github/workflows/cf-warp.yml"
  pull_request:
    paths:
      - "cf-warp/**"
      - ".github/workflows/cf-warp.yml"
  workflow_dispatch:
    inputs:
      warp_version:
        description: "cloudflare-warp package version (blank = latest in repo)"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cf-warp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/cf-warp' }}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=warp-${{ inputs.warp_version }},enable=${{ inputs.warp_version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cf-warp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WARP_VERSION=${{ inputs.warp_version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
